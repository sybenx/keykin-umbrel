manifestVersion: 1
id: keykin-storage
category: files
name: Keykin Storage
version: "0.6.0"
tagline: A home for your files, and your friends'
icon: https://raw.githubusercontent.com/sybenx/keykin-umbrel/main/assets/keykin-storage.svg
description: >-
  A Blossom server for your Nostr account. Your account and friends you add can store files on
  it; anyone can read a file by its hash. Marble's vaults keep their files encrypted, so this box
  only ever sees ciphertext.


  Nothing is deleted behind your back. When the last owner of a file deletes it, it waits 30
  days in a bin, still on disk and still served, so a mistake or a stolen phone can be undone.
  Each friend has a quota.


  Phones and other servers need to reach it from outside, so give it a public address (a
  Cloudflare Tunnel or your own reverse proxy) and put that address in STORAGE_PUBLIC_URL. Set
  STORAGE_OWNER to your npub. Until both are set it serves nothing new and refuses uploads.


  It can follow a home's member list: set STORAGE_HOME_URL and everyone in that home gets an
  account, and anyone removed from the home loses theirs.


  Beta: it has had two reviews, not an outside one.
releaseNotes: >-
  Photo places for DMs. With a home set, this box keeps a small place note for each photo sent
  from that home and hands it only to people in the home. It also looks up town names itself,
  from a list built into the app, so no place is sent anywhere else.
developer: sybenx
website: https://github.com/sybenx/keykin-storage
dependencies: []
repo: https://github.com/sybenx/keykin-storage
support: https://github.com/sybenx/keykin-storage/issues
port: 7480
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: sybenx
submission: https://github.com/sybenx/keykin-umbrel
environment:
  - name: STORAGE_PUBLIC_URL
    services:
      - server
    note: The address phones and other servers reach this box at, for example https://storage.example.com. Uploads must name this address, so it has to be the one in your Nostr server list.
  - name: STORAGE_OWNER
    services:
      - server
    note: Your npub. Your account can store without a limit. Add friends with the command in the README.
  - name: STORAGE_BEHIND_CLOUDFLARE
    services:
      - server
    note: Set to true when a Cloudflare Tunnel is the way in. The rate limit then counts each visitor by their own address. Leave empty otherwise.
  - name: STORAGE_HOME_URL
    services:
      - server
    note: Optional. The https address of a home whose members get accounts here. Register this box's key on the home first (the README says how).
  - name: STORAGE_MEMBER_QUOTA
    services:
      - server
    note: Optional. How much each member of the home may store, for example 5G. The default is 5G.
# Blobs can be terabytes, and this box is itself the copy that keeps them. The database (accounts,
# owners, the bin) is small and is backed up.
backupIgnore:
  - data/blobs
  - data/tmp
