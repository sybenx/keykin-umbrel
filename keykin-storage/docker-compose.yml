version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: keykin-storage_server_1
      APP_PORT: 7480
      # Blossom is public by design: writes carry their own signed authorization, reads are by hash.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/sybenx/keykin-storage:0.3.0@sha256:755a33ccd1af3c33e0af5f6d8303c2fe319f1a5f111be60f5c746ae9f2566605
    user: "1000:1000"
    restart: on-failure
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 64
    environment:
      STORAGE_DIR: /data
      STORAGE_ADDR: 0.0.0.0
      STORAGE_PORT: "7480"
    volumes:
      - ${APP_DATA_DIR}/data:/data
