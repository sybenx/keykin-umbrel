version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: keykin-login_server_1
      APP_PORT: 7470
      # The account page has its own sign-in and is meant to be public.
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/sybenx/keykin-login:0.1.32@sha256:c64cfe76d497210a8ec7c70c90b5a2a3d7ad71c1342ed142ac243b252c68509c
    user: "1000:1000"
    restart: on-failure
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      KEYKIN_BOX: http://keykin-box_server_1:7461
      KEYKIN_LOGIN_ADDR: 0.0.0.0
      KEYKIN_LOGIN_PORT: "7470"
